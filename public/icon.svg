<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#FAF8F5" />
  <rect x="36" y="36" width="440" height="440" rx="92" fill="#F3EDE4" />
  <g transform="translate(256, 256)">
    <!-- Isometric 3D cube -->
    <polygon points="0,-128 112,-64 0,0 -112,-64" fill="#E98A66" />
    <polygon points="-112,-64 0,0 0,128 -112,64" fill="#D96B43" />
    <polygon points="112,-64 112,64 0,128 0,0" fill="#B54F2B" />
    <!-- Subtle inner highlight -->
    <polyline points="-112,-64 0,0 112,-64" fill="none" stroke="#FAF8F5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />
    <line x1="0" y1="0" x2="0" y2="128" stroke="#FAF8F5" stroke-width="8" stroke-linecap="round" opacity="0.7" />
  </g>
</svg>
